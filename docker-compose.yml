services:
  db:
    image: postgres:18
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - db_dados:/var/lib/postgresql
    environment:
      TZ: America/Sao_Paulo
    ports:
      - "5434:5432"
    networks:
      - javaFic-network
  springbootfic:
    image: springbootfic
    restart: unless-stopped
    env_file:
      - .env
    build: ./V1
    working_dir: /V1
    ports:
      - 8080:8080
    environment:
      TZ: America/Sao_Paulo
    command: mvn spring-boot:run

    depends_on:
      - db
    networks:
      - javaFic-network

  frontendangular:
    build: ./V1/frontend
    restart: unless-stopped
    ports:
      - 4201:4200
    networks:
      - javaFic-network
    depends_on:
      - springbootfic
networks:
  javaFic-network:
    driver: bridge

volumes:
  db_dados:
