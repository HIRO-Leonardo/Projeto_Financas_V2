spring.application.name=Sistema-Despesas

spring.config.import=optional:file:.env[.properties]

spring.datasource.url=${DATA_BASE_URL}
spring.datasource.username=${DATA_BASE_NAME}
spring.datasource.password=${DATA_BASE_PASSWORD}
spring.datasource.driver-class-name=${SPRING_DRIVER}
spring.jpa.hibernate.ddl-auto=${HIBERNATE_DLL}
spring.jpa.show-sql=${SHOW_SQL}